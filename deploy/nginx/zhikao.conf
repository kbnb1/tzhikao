# ============================================================
# 智考AI - Nginx 配置文件
# 项目: ThinkPHP 8.x + 静态介绍页
# ============================================================

# HTTP 重定向到 HTTPS（启用SSL后取消注释）
# server {
#     listen 80;
#     server_name {{DOMAIN}} {{SERVER_IP}};
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;  # 启用SSL后取消注释
    server_name {{DOMAIN}} {{SERVER_IP}};

    # SSL 证书配置（启用SSL后取消注释并修改路径）
    # ssl_certificate     /etc/nginx/ssl/zhikao.crt;
    # ssl_certificate_key /etc/nginx/ssl/zhikao.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # 项目根目录
    root {{PROJECT_DIR}}/public;
    index index.php index.html index.htm;

    # 字符集
    charset utf-8;

    # ==================================================
    # 安全头配置
    # ==================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;

    # ==================================================
    # Gzip 压缩配置
    # ==================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/xhtml+xml
        application/xml
        image/svg+xml
        image/x-icon
        application/rss+xml
        application/atom_xml
        font/ttf
        font/otf;
    gzip_disable "MSIE [1-6]\.";

    # ==================================================
    # 日志配置
    # ==================================================
    access_log /var/log/nginx/zhikao_access.log;
    error_log  /var/log/nginx/zhikao_error.log;

    # ==================================================
    # 隐藏 Nginx 版本号
    # ==================================================
    server_tokens off;

    # ==================================================
    # 禁止访问隐藏文件
    # ==================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==================================================
    # 静态资源缓存配置
    # ==================================================
    
    # 图片缓存
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|bmp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # CSS/JS 缓存
    location ~* \.(css|js)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 字体文件缓存
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # HTML 缓存
    location ~* \.(html|htm)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ==================================================
    # 介绍页面（静态HTML）
    # ==================================================
    location /intro/ {
        alias {{PROJECT_DIR}}/public/intro/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ==================================================
    # ThinkPHP 重写规则
    # ==================================================
    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    # ==================================================
    # 禁止直接访问特定目录
    # ==================================================
    location ~* /(runtime|application|thinkphp|config|route|model|controller|view)/ {
        return 403;
    }

    # ==================================================
    # PHP 处理
    # ==================================================
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:{{PHP_FPM_SOCK}};
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # 超时设置
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # 上传大小限制
        fastcgi_param PHP_VALUE "upload_max_filesize=50M
post_max_size=50M
max_execution_time=300";

        # PATH_INFO 支持
        set $path_info "";
        set $real_script_name $fastcgi_script_name;
        if ($fastcgi_script_name ~ "^(.+?\.php)(/.+)$") {
            set $real_script_name $1;
            set $path_info $2;
        }
        fastcgi_param SCRIPT_NAME $real_script_name;
        fastcgi_param PATH_INFO $path_info;
    }

    # ==================================================
    # 上传目录限制（禁止执行 PHP
    # ==================================================
    location ~* ^/uploads/.*\.php$ {
        deny all;
    }

    # ==================================================
    # 限流配置（根据需要启用）
    # ==================================================
    # limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # location /api/ {
    #     limit_req zone=api burst=20 nodelay;
    #     try_files $uri $uri/ /index.php?s=$uri&$args;
    # }

    # ==================================================
    # 健康检查
    # ==================================================
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ==================================================
    # 禁止访问敏感文件
    # ==================================================
    location ~* \.(env|sql|bak|swp|~|git|svn|csv)$ {
        deny all;
        return 404;
    }

    # ==================================================
    # robots.txt
    # ==================================================
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # ==================================================
    # favicon.ico
    # ==================================================
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}

